name: Build and dispatch deploy

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
      - 'tests/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: evo-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/staging' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image_ref: ${{ steps.deployref.outputs.image_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == main || "${GITHUB_REF_NAME}" == staging ]]
          [[ "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]]
          tag="${GITHUB_REF_NAME}-${GITHUB_SHA}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push branch image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/we-digital/wdgtl-evo-api:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=wdgtl-evo-api-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=wdgtl-evo-api-${{ github.ref_name }}

      - name: Export immutable image reference
        id: deployref
        env:
          DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" == main || "${GITHUB_REF_NAME}" == staging ]]
          [[ "${GITHUB_SHA}" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image_ref="ghcr.io/we-digital/wdgtl-evo-api:${GITHUB_REF_NAME}-${GITHUB_SHA}@$DIGEST"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Dispatch production deployment
        if: >-
          github.ref == 'refs/heads/main' &&
          vars.PRODUCTION_AUTO_DEPLOY_ENABLED == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BBC_DEVOPS_DISPATCH_TOKEN }}
          repository: we-digital/bbc-devops
          event-type: deploy-evo-api
          client-payload: |
            {
              "image_ref": "${{ steps.deployref.outputs.image_ref }}",
              "source_repository": "${{ github.repository }}",
              "source_ref": "${{ github.ref_name }}",
              "source_sha": "${{ github.sha }}",
              "host": "bbc-evo"
            }

      - name: Dispatch staging deployment
        if: >-
          github.ref == 'refs/heads/staging' &&
          vars.STAGE_AUTO_DEPLOY_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ secrets.BBC_DEVOPS_DISPATCH_TOKEN }}
          IMAGE_REF: ${{ steps.deployref.outputs.image_ref }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REF" =~ ^ghcr\.io/we-digital/wdgtl-evo-api:staging-${GITHUB_SHA}@sha256:[a-f0-9]{64}$ ]]
          gh workflow run deploy-stage-evo.yml \
            --repo we-digital/bbc-devops \
            --ref staging \
            --field image_ref="$IMAGE_REF" \
            --field source_ref=staging \
            --field source_sha="$GITHUB_SHA"
