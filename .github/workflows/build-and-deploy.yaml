name: Build and Deploy to DO App Platform

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compute deploy tag
        id: deploytag
        if: github.event_name == 'push'
        run: |
          short_sha=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Trigger bbc-devops auto-deploy
        if: github.event_name == 'push'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BBC_DEVOPS_DISPATCH_TOKEN }}
          repository: we-digital/bbc-devops
          event-type: deploy-evo-api
          client-payload: |
            {
              "version": "${{ steps.deploytag.outputs.tag }}",
              "host": "bbc-evo"
            }

  # Legacy App Platform deploy. After Phase 4.1 cutover (evo.respon.io DNS
  # flipped to bbc-evo droplet), this job is dead weight — `apps create-deployment`
  # will run against a scaled-to-0 component. Remove in the cutover follow-up PR.
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Trigger deployment
        run: doctl apps create-deployment ${{ secrets.DO_APP_ID }} --force-rebuild
