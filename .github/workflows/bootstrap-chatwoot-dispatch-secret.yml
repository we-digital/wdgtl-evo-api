name: Bootstrap Chatwoot dispatch credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy the existing protected dispatch credential
        env:
          DISPATCH_TOKEN: ${{ secrets.BBC_DEVOPS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$DISPATCH_TOKEN" ]]
          printf '%s' "$DISPATCH_TOKEN" |
            GH_TOKEN="$DISPATCH_TOKEN" gh secret set BBC_DEVOPS_DISPATCH_TOKEN \
              --repo we-digital/wedigital-chatwoot
          GH_TOKEN="$DISPATCH_TOKEN" gh secret list \
            --repo we-digital/wedigital-chatwoot |
            awk '{ print $1 }' |
            grep -Fx BBC_DEVOPS_DISPATCH_TOKEN
